name: Build and deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the build to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # The worker deploys by hand, never from CI — but its typecheck is free,
      # and it needs the worker's own node_modules for @cloudflare/workers-types.
      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Type check
        run: npm run typecheck

      - name: Type check worker
        run: npm run typecheck:worker

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
