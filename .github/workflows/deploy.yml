name: Build and deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the build to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24: tools/diagramas.mjs imports src/engine/*.ts directly (type stripping).
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # The worker deploys by hand, never from CI — but its typecheck is free,
      # and it needs the worker's own node_modules for @cloudflare/workers-types.
      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Type check
        run: npm run typecheck

      - name: Type check worker
        run: npm run typecheck:worker

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # La canónica: mpodeley.github.io/curso-ia-energia (cuenta personal, sin
      # dominio custom, sirve directo). Necesita ACTIONS_DEPLOY_KEY, una deploy
      # key con escritura sobre mpodeley/curso-ia-energia; mientras el secret
      # no exista, el paso se saltea y la canónica se publica a mano (README).
      # El contexto secrets no se puede leer en un if de paso, por eso el flag
      # pasa por un output.
      - name: Check deploy key
        id: haskey
        run: echo "has=${{ secrets.ACTIONS_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages (canónica, mpodeley)
        if: ${{ steps.haskey.outputs.has == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: mpodeley/curso-ia-energia
          publish_dir: ./dist

      # El respaldo en la org: por el dominio custom termina servido en
      # podeley.ar/curso-ia-energia/ (github.io responde 301 hacia ahí).
      - name: Deploy to GitHub Pages (respaldo org)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
