name = "curso-energia-ypfb-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Arranca en el subdominio workers.dev. Un custom domain (curso-api.podeley.ar)
# exigiría la zona podeley.ar en Cloudflare, y hoy los NS están en Porkbun
# apuntando a GitHub Pages: migrarlos es mover un dominio con sitio vivo y
# subdominios, no algo para hacer días antes de una clase.
#
# Si el firewall de YPFB bloquea *.workers.dev —probarlo con una semana de
# anticipación, ver README— ahí sí conviene migrar la zona y agregar acá:
#   [[routes]]
#   pattern = "curso-api.podeley.ar"
#   custom_domain = true
# Estuvo en false del 2026-08-11 al 2026-09-15: pestañas viejas del sitio —con el
# bug de polling de usePoll ya arreglado en el cliente pero todavía corriendo en
# memoria— golpeaban este worker a ~6-9k req/min y agotaban la cuota diaria del
# plan Free, tirando TODOS los workers de la cuenta con 1027. Con la ruta apagada,
# esos requests son error de borde y NO cuentan contra la cuota. Entre ediciones
# conviene volver a false; antes de una clase, true + `npm run deploy` + cerrar
# cualquier pestaña vieja abierta.
workers_dev = true

# Cada deploy publicaría además una URL propia de su versión, todas apuntando a
# los mismos secretos y a la misma base. Para una herramienta de clase en vivo
# eso es superficie de más sin nada a cambio: la única URL es la de arriba.
preview_urls = false

[vars]
# La estampa el Worker en cada fila; el cliente no la manda y no puede falsearla.
# Cohorte nueva = cambiar esta línea y `npm run deploy`. Las filas viejas quedan
# consultables desde el selector de edición del panel. Ediciones dictadas:
# ypfb-andina-2026-08 (respaldo SQL fuera del repo, 2026-09-15).
EDICION = "multiempresa-2026-09"

# Allowlist exacta de CORS. Sin esto no entra ningún origen.
# mpodeley.github.io es la URL canónica del curso (cuenta personal, sin dominio
# custom: sirve directo). podeley.ar y podeley.github.io quedan por la copia de
# respaldo en la org: el dominio custom absorbe las project pages, así que esa
# copia se sirve desde podeley.ar y github.io responde 301 hacia ahí.
ORIGENES = "https://mpodeley.github.io,https://podeley.ar,https://podeley.github.io,http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "curso-energia-ypfb"
# Lo devuelve `npx wrangler d1 create curso-energia-ypfb`.
database_id = "9b2c26a5-245f-4ca2-a08d-c686ab4bf87d"

# Los tres secretos NO van acá. Se cargan una vez con:
#   npx wrangler secret put PIN_ALUMNO       (el que se proyecta en una slide)
#   npx wrangler secret put PIN_INSTRUCTOR
#   npx wrangler secret put TOKEN_SECRET     (openssl rand -hex 32)
# En local van en worker/.dev.vars, que está gitignoreado.

# Un tope de CPU por invocación (bloque [limits] con cpu_ms) sería un lindo
# guardarraíl, pero es un feature de Workers Paid: en Free la API lo rechaza
# (code 100328). El costo real de este incidente era por CANTIDAD de requests,
# que ni cpu_ms ni un 429 del worker topan; se arregló en el cliente
# (src/hooks/usePoll.ts). Si algún día se pasa a Paid, se puede agregar acá.
